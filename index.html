<!doctype html>
<!--
  TEMPLATE. Replace every placeholder token before publishing; `scripts/verify-site.ts`
  fails if any are left. See README.md for the full list and docs/DESIGN.md for why
  each value exists. Nothing here loads from a third party: fonts are self-hosted,
  there is no analytics, and the pages ship zero JavaScript.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0d1d">
  <title>{{BOT_NAME}}</title>
  <link rel="icon" type="image/webp" href="assets/avatar.webp">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{BOT_NAME}}">
  <meta property="og:description" content="{{TAGLINE}}">
  <meta property="og:image" content="{{SITE_ORIGIN}}/assets/avatar.webp">
  <meta property="og:url" content="{{SITE_ORIGIN}}/">
  <meta name="twitter:card" content="summary">
  <style>
    /* Self-hosted, latin subset, variable weight. Both families are OFL 1.1
       (assets/fonts/OFL-*.txt). Do not swap these for a CDN link: the sites make
       no third-party requests by design. */
    @font-face {
      font-family: 'Inter';
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      src: url(assets/fonts/inter-latin.woff2) format('woff2');
    }
    @font-face {
      font-family: 'Space Grotesk';
      font-style: normal;
      font-weight: 500 700;
      font-display: swap;
      src: url(assets/fonts/space-grotesk-latin.woff2) format('woff2');
    }
    /* One accent per site, and the whole site is built from it -- an accent belongs
       to one bot (see docs/DESIGN.md). Everything else is neutral. */
    :root {
      --accent: {{ACCENT}};
      --accent-bright: color-mix(in srgb, var(--accent) 65%, #ffffff);
      --accent-dim: color-mix(in srgb, var(--accent) 45%, #0c0d1d);
      --ground: #0c0d1d;
      --panel: rgba(22, 27, 34, 0.6);
      --border: #21262d;
      --text: #e6edf3;
      --text-soft: #c9d1d9;
      --text-muted: #8b949e;
      --text-quiet: #8b93a1;
    }
    /* Every anchor is the accent by default. A link with no rule of its own falls through to
       the browser's default blue, which measures far below AA on this ground; the component
       rules below refine this rather than replace it. */
    a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
    a:hover { color: var(--accent-bright); border-bottom-color: var(--accent-bright); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* The root carries an opaque colour, so no gap -- during the mobile URL-bar
       resize or on overscroll -- can ever show the canvas's default white. */
    html { height: 100%; background-color: var(--ground); }
    body {
      min-height: 100vh;   /* fallback for browsers without dvh */
      min-height: 100dvh;  /* tracks the URL bar as it hides and shows */
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* deliberately transparent: an opaque background here would paint over the
         fixed gradient layer below (see body::before) and hide it completely */
      color: var(--text);
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    /* The gradient lives on a viewport-fixed layer, so it stays put while a long
       page scrolls and no scroll position lands on the flat end of it. */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(900px 620px at 18% 6%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 62%),
        radial-gradient(1200px 800px at 20% 10%, #171834 0%, #131530 52%, var(--ground) 100%);
    }
    main {
      text-align: center;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 13px;
      padding: 24px 12px;
    }
    .avatar {
      position: relative;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      padding: 3px;
      background: conic-gradient(from 210deg, var(--accent-dim), var(--accent), var(--accent-bright), var(--accent-dim));
      box-shadow: 0 0 44px color-mix(in srgb, var(--accent) 22%, transparent);
      animation: float 6s ease-in-out infinite;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: block;
      background: var(--ground);
      pointer-events: none;
    }
    /* Boop: a small, optional piece of personality. Keep it, or drop it and the
       :active rule below -- it carries no information. */
    .avatar::after {
      content: "boop! \1F916";
      position: absolute;
      top: -8px;
      right: -36px;
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      color: var(--accent-bright);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s;
    }
    .avatar:active::after { opacity: 1; }
    .avatar:active { animation: none; transform: scale(0.92) rotate(6deg); }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(30px, 7.5vw, 38px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .tagline {
      font-size: clamp(15px, 4vw, 17px);
      color: var(--text-soft);
      font-weight: 500;
    }
    .intro {
      font-size: clamp(13.5px, 3.6vw, 15px);
      color: var(--text-muted);
      line-height: 1.55;
      max-width: 330px;
    }
    .help { font-size: 12.5px; color: var(--text-quiet); }
    .help a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .help a:hover {
      color: var(--accent-bright);
      border-bottom-color: var(--accent-bright);
    }
    /* The header: the bot's own face at the left of the top line, its links at the right,
       one block on every page. Fixed -- the front page is one screen and does not scroll.
       The markup between the HEADER markers is byte-identical on both pages and
       scripts/verify-site.ts fails if the two copies diverge. */
    .top {
      position: fixed;
      top: 20px;
      left: 22px;
      right: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
    }
    /* The avatar carries the front page's own ring: the same conic gradient, painted on the
       avatar's box rather than on a ::after, so it only ever fits the mark it surrounds.
       2px of rim rather than the big avatar's 3px -- 3px on a 32px circle reads as a hoop.
       The ring is opaque, so it is also the avatar's ground on a page that scrolls under it. */
    .top .portrait {
      display: inline-flex;
      align-items: center;
      padding: 2px;
      border-radius: 50%;
      background: conic-gradient(from 210deg, var(--accent-dim), var(--accent), var(--accent-bright), var(--accent-dim));
      box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 22%, transparent);
      /* One of the page's two links with no underline (the GitHub mark is the other): a
         1px line under a circle reads as a mistake, not as a link cue. Hover still
         brightens the colour, so the affordance is not lost. */
      border-bottom: none;
    }
    .top .portrait img {
      display: block;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--ground);
    }
    .top .links {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .top .icon {
      display: inline-flex;
      align-items: center;
      /* The other link with no underline: the global rule's 1px line under a 15px mark
         reads as a mistake rather than as a link cue. Hover still brightens the colour,
         so the affordance is not lost. */
      border-bottom: none;
    }
    .top .icon svg {
      display: block;
      fill: currentColor;
    }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
    @media (prefers-reduced-motion: reduce) {
      .avatar { animation: none; }
      .avatar::after { transition: none; }
    }
  </style>
</head>
<body>
  <!-- HEADER:START -->
  <nav class="top" aria-label="Main">
    <a class="portrait" href="index.html" aria-label="{{BOT_NAME}} — home" title="{{BOT_NAME}}">
      <img src="assets/avatar.webp" alt="" width="32" height="32">
    </a>
    <div class="links">
      <a href="log.html">Log</a>
      <a href="{{BOARD_URL}}">Board</a>
      <a class="icon" href="https://github.com/{{GITHUB_HANDLE}}" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
          <path d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656" />
        </svg>
      </a>
    </div>
  </nav>
  <!-- HEADER:END -->
  <main>
    <div class="avatar" title="boop!">
      <img src="assets/avatar.webp" alt="{{BOT_NAME}} avatar" width="92" height="92">
    </div>
    <h1>{{BOT_NAME}}</h1>
    <p class="tagline">{{TAGLINE}}</p>
    <p class="intro">{{INTRO}}</p>
    <p class="help">Part of <a href="https://aivara.se">aivara.se</a> &middot; <a href="mailto:{{EMAIL}}">{{EMAIL}}</a></p>
  </main>
</body>
</html>
